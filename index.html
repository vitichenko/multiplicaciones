<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aprende a Multiplicar</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f4f8;
      touch-action: manipulation;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 360px;
      text-align: center;
      position: relative;
    }

    .mode-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .mode-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 8px 2px 7px;
      font-size: 1.4rem;
      line-height: 1;
      border-radius: 12px;
      background: #eef2f7;
      color: #475569;
      box-shadow: 0 3px #cbd5e1;
    }

    .mode-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px #cbd5e1;
    }

    .mode-btn.active {
      background: #3b82f6;
      color: #fff;
      box-shadow: 0 3px #2563eb;
    }

    .mode-btn.active:active {
      box-shadow: 0 1px #2563eb;
    }

    .mode-txt {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .lives {
      font-size: 1.4rem;
      letter-spacing: 2px;
    }

    .record-line {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 700;
      margin: -4px 4px 10px;
      text-align: center;
    }

    .timer-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 4px 10px;
    }

    .timer-track {
      flex: 1;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: #22c55e;
      border-radius: 999px;
      transition: width 0.08s linear, background-color 0.2s ease;
    }

    .timer-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: #64748b;
      min-width: 48px;
      text-align: right;
    }

    .badges {
      display: flex;
      gap: 6px;
    }

    .score-badge,
    .level-badge,
    .streak-badge {
      background: #e2e8f0;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .level-badge {
      background: #fef3c7;
      color: #b45309;
    }

    .streak-badge {
      background: #ffedd5;
      color: #c2410c;
    }

    .question {
      font-size: 2.8rem;
      font-weight: 700;
      color: #1e293b;
      margin: 10px 0 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .answer-box {
      font-size: 2.2rem;
      font-weight: 700;
      min-height: 56px;
      background: #f8fafc;
      border: 3px solid #cbd5e1;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      color: #0f172a;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    button {
      font-size: 1.6rem;
      font-weight: 600;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #e2e8f0;
      color: #334155;
      cursor: pointer;
      box-shadow: 0 4px #cbd5e1;
      user-select: none;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px #cbd5e1;
    }

    button.clear {
      background: #fee2e2;
      color: #dc2626;
      box-shadow: 0 4px #fca5a5;
    }

    button.clear:active {
      box-shadow: 0 1px #fca5a5;
    }

    button.check {
      background: #dcfce7;
      color: #16a34a;
      box-shadow: 0 4px #86efac;
    }

    button.check:active {
      box-shadow: 0 1px #86efac;
    }

    .feedback {
      height: 28px;
      margin-top: 14px;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .correct {
      color: #16a34a;
    }

    .incorrect {
      color: #dc2626;
    }

    .bonus {
      color: #ea580c;
    }

    .record-new {
      color: #ca8a04;
    }

    .game-over-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      border-radius: 24px;
      padding: 24px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .game-over-modal.show {
      display: flex;
    }

    .game-over-modal h2 {
      margin: 0;
      font-size: 2rem;
      color: #dc2626;
    }

    .game-over-modal p {
      margin: 0;
      font-size: 1.2rem;
      color: #475569;
    }

    .btn-restart {
      background: #3b82f6;
      color: white;
      box-shadow: 0 4px #2563eb;
      padding: 14px 28px;
      font-size: 1.2rem;
      margin-top: 8px;
    }

    .btn-restart:active {
      box-shadow: 0 1px #2563eb;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="mode-bar" id="modeBar">
      <button class="mode-btn active" data-mode="×" onclick="elegirModo('×')"><span class="mode-sym">×</span><span class="mode-txt">Multiplicar</span></button>
      <button class="mode-btn" data-mode="+" onclick="elegirModo('+')"><span class="mode-sym">+</span><span class="mode-txt">Sumar</span></button>
      <button class="mode-btn" data-mode="-" onclick="elegirModo('-')"><span class="mode-sym">-</span><span class="mode-txt">Restar</span></button>
      <button class="mode-btn" data-mode="÷" onclick="elegirModo('÷')"><span class="mode-sym">÷</span><span class="mode-txt">Dividir</span></button>
    </div>

    <div class="status-bar">
      <div class="lives" id="lives">❤️❤️❤️</div>
      <div class="badges">
        <span class="streak-badge" id="streakBadge">🔥 <span id="streak">0</span></span>
        <span class="level-badge" id="level">Nvl 1</span>
        <span class="score-badge">⭐ <span id="score">0</span></span>
      </div>
    </div>

    <div class="record-line">🏆 Máxima puntuación <span id="recordMode">×</span>: <span id="record">0</span></div>

    <div class="timer-container">
      <div class="timer-track">
        <div class="timer-bar" id="timerBar"></div>
      </div>
      <span class="timer-label" id="timerLabel">⏱️ 15s</span>
    </div>

    <div class="question">
      <span id="n1">0</span>
      <span id="opSign">×</span>
      <span id="n2">0</span>
    </div>

    <div class="answer-box" id="display"></div>

    <div class="grid">
      <button onclick="addNum('1')">1</button>
      <button onclick="addNum('2')">2</button>
      <button onclick="addNum('3')">3</button>
      <button onclick="addNum('4')">4</button>
      <button onclick="addNum('5')">5</button>
      <button onclick="addNum('6')">6</button>
      <button onclick="addNum('7')">7</button>
      <button onclick="addNum('8')">8</button>
      <button onclick="addNum('9')">9</button>
      <button class="clear" onclick="clearInput()">✕</button>
      <button onclick="addNum('0')">0</button>
      <button class="check" onclick="checkAnswer()">✓</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="game-over-modal" id="gameOverModal">
      <h2>¡Fin de la partida! 💔</h2>
      <p>Has conseguido <b id="finalScore">0</b> puntos.</p>
      <button class="btn-restart" onclick="resetGame()">Jugar otra vez 🔁</button>
    </div>
  </div>

  <script>
    let mode = "×"; // operación activa: × (multiplicar), + (sumar), - (restar), ÷ (dividir)
    let num1 = 0;
    let num2 = 0;
    let currentVal = "";
    let lives = 3;
    let score = 0;
    let streak = 0;
    let record = 0; // máxima puntuación (se guarda entre partidas)
    let totalAciertos = 0; // aciertos acumulados: nunca baja (marca la dificultad)
    let busy = false; // bloquea dobles pulsaciones mientras hay feedback
    let pendingTimer = null;
    const MAX_LIVES = 5;
    const failedQueue = [];

    // Temporizador
    let timerId = null;
    let timerTotalMs = 0;
    let timerRemainingMs = 0;
    let timerLastTick = 0;

    // Estado independiente por cada modo de juego
    const MODES = ["×", "+", "-", "÷"];
    const CLAVE_ESTADOS = "multi_estados_modos";

    function crearEstadoInicial() {
      return {
        lives: 3,
        score: 0,
        streak: 0,
        totalAciertos: 0,
        num1: null,
        num2: null,
        failedQueue: [],
        gameOver: false
      };
    }

    function cargarEstadosGuardados() {
      try {
        const data = localStorage.getItem(CLAVE_ESTADOS);
        if (data) {
          const parsed = JSON.parse(data);
          if (parsed && typeof parsed === "object") {
            const estados = {};
            for (const m of MODES) {
              if (parsed[m] && typeof parsed[m].lives === "number") {
                estados[m] = parsed[m];
              } else {
                estados[m] = crearEstadoInicial();
              }
            }
            return estados;
          }
        }
      } catch (e) {}
      return {
        "×": crearEstadoInicial(),
        "+": crearEstadoInicial(),
        "-": crearEstadoInicial(),
        "÷": crearEstadoInicial()
      };
    }

    const modoEstados = cargarEstadosGuardados();

    function guardarEstadosEnStorage() {
      try {
        localStorage.setItem(CLAVE_ESTADOS, JSON.stringify(modoEstados));
      } catch (e) {}
    }

    function cargarEstadoModo(m) {
      const est = modoEstados[m];
      num1 = est.num1;
      num2 = est.num2;
      lives = est.lives;
      score = est.score;
      streak = est.streak;
      totalAciertos = est.totalAciertos;
      failedQueue.length = 0;
      if (Array.isArray(est.failedQueue)) {
        failedQueue.push(...est.failedQueue);
      }
    }

    function guardarEstadoModo(m) {
      modoEstados[m] = {
        lives,
        score,
        streak,
        totalAciertos,
        num1,
        num2,
        failedQueue: [...failedQueue],
        gameOver: lives <= 0
      };
      guardarEstadosEnStorage();
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function getAdaptiveFactor(probHigh, minHigh, minLow, maxLow) {
      if (Math.random() < probHigh) {
        return randomInt(minHigh, 10);
      } else {
        return randomInt(minLow, maxLow);
      }
    }

    function updateLevelBadge() {
      const levelEl = document.getElementById("level");
      if (totalAciertos < 5) levelEl.textContent = "Nvl 1";
      else if (totalAciertos < 10) levelEl.textContent = "Nvl 2";
      else if (totalAciertos < 20) levelEl.textContent = "Nvl 3";
      else levelEl.textContent = "Pro 🔥";
    }

    function renderLives() {
      let hearts = "";
      for (let i = 0; i < lives; i++) hearts += "❤️";
      document.getElementById("lives").textContent = hearts;
    }

    function renderScore() {
      document.getElementById("score").textContent = score;
    }

    function renderStreak() {
      document.getElementById("streak").textContent = streak;
    }

    // Un récord (mejor puntuación) por cada tipo de operación
    const CLAVE_RECORD = {
      "×": "multi_max_puntuacion",
      "+": "suma_max_puntuacion",
      "-": "resta_max_puntuacion",
      "÷": "division_max_puntuacion"
    };

    function loadRecord(m) {
      try {
        const v = parseInt(localStorage.getItem(CLAVE_RECORD[m]), 10);
        return Number.isFinite(v) && v > 0 ? v : 0;
      } catch (e) {
        return 0;
      }
    }

    function saveRecord() {
      try {
        localStorage.setItem(CLAVE_RECORD[mode], String(record));
      } catch (e) {
        /* sin almacenamiento disponible: el récord dura solo la sesión */
      }
    }

    function renderRecord() {
      document.getElementById("record").textContent = record;
      document.getElementById("recordMode").textContent = mode;
    }

    // Nivel de dificultad según aciertos acumulados (nunca baja)
    function nivelDificultad() {
      if (totalAciertos < 5) return 0;
      if (totalAciertos < 10) return 1;
      if (totalAciertos < 20) return 2;
      return 3;
    }

    // Tiempo límite según nivel y complejidad
    function calcularTiempoLimite() {
      const n = nivelDificultad();
      const tiemposBase = [15, 12, 10, 8]; // segundos para Nvl 1, Nvl 2, Nvl 3 y Pro
      let segundos = tiemposBase[n];

      // Margen extra de +2s para operaciones con números de 2 cifras o divisiones
      if ((mode === "+" || mode === "-") && n >= 2) {
        segundos += 2;
      } else if (mode === "÷" && n >= 2) {
        segundos += 2;
      }

      return segundos * 1000;
    }

    function renderTimerBar(fraction) {
      const bar = document.getElementById("timerBar");
      const label = document.getElementById("timerLabel");
      if (!bar) return;

      const percent = Math.max(0, Math.min(100, fraction * 100));
      bar.style.width = percent + "%";

      const sec = Math.ceil(timerRemainingMs / 1000);
      if (label) {
        label.textContent = `⏱️ ${Math.max(0, sec)}s`;
        if (percent <= 18) {
          label.style.color = "#ef4444";
        } else if (percent <= 35) {
          label.style.color = "#d97706";
        } else {
          label.style.color = "#64748b";
        }
      }

      if (percent > 35) {
        bar.style.background = "#22c55e";
      } else if (percent > 18) {
        bar.style.background = "#f59e0b";
      } else {
        bar.style.background = "#ef4444";
      }
    }

    function iniciarTemporizador() {
      detenerTemporizador();
      if (lives <= 0) {
        renderTimerBar(0);
        return;
      }

      timerTotalMs = calcularTiempoLimite();
      timerRemainingMs = timerTotalMs;
      timerLastTick = Date.now();
      renderTimerBar(1);

      timerId = setInterval(() => {
        const now = Date.now();
        const delta = now - timerLastTick;
        timerLastTick = now;
        timerRemainingMs -= delta;

        if (timerRemainingMs <= 0) {
          detenerTemporizador();
          timerRemainingMs = 0;
          renderTimerBar(0);
          tiempoAgotado();
        } else {
          renderTimerBar(timerRemainingMs / timerTotalMs);
        }
      }, 50);
    }

    function detenerTemporizador() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    // Devuelve una operación {a, b} del modo activo: "a op b = resultado"
    function generarOperacion() {
      const n = nivelDificultad();

      // Multiplicación: tablas (mismo comportamiento que siempre)
      if (mode === "×") {
        let f1, f2;
        if (n === 0) {
          f1 = randomInt(0, 10); f2 = randomInt(0, 10);
        } else if (n === 1) {
          f1 = getAdaptiveFactor(0.60, 5, 2, 4);
          f2 = getAdaptiveFactor(0.40, 5, 2, 4);
        } else if (n === 2) {
          f1 = getAdaptiveFactor(0.75, 6, 2, 5);
          f2 = getAdaptiveFactor(0.50, 6, 2, 5);
        } else {
          f1 = getAdaptiveFactor(0.85, 6, 3, 5);
          f2 = getAdaptiveFactor(0.70, 6, 3, 5);
        }
        return Math.random() < 0.5 ? { a: f1, b: f2 } : { a: f2, b: f1 };
      }

      // Suma y resta: números de 0 a 100 según el nivel
      if (mode === "+" || mode === "-") {
        const tope = [10, 30, 60, 100][n];
        if (mode === "+") {
          return { a: randomInt(0, tope), b: randomInt(0, tope) };
        }
        // Resta con resultado siempre >= 0
        const a = randomInt(0, tope);
        for (let i = 0; i < 5; i++) {
          const b = randomInt(0, a);
          if (n < 2 || (a - b !== 0 && a - b !== a)) {
            return { a: a, b: b };
          }
        }
        return { a: a, b: randomInt(0, a) };
      }

      // División entera: dividendo = divisor x cociente (respuesta = cociente)
      const divisor = randomInt([2, 2, 2, 2][n], [5, 7, 9, 10][n]);
      const cociente = randomInt([1, 2, 2, 4][n], [5, 8, 10, 10][n]);
      return { a: divisor * cociente, b: divisor };
    }

    // Resultado correcto de la operación actual
    function resolverResultado() {
      if (mode === "×") return num1 * num2;
      if (mode === "+") return num1 + num2;
      if (mode === "-") return num1 - num2; // la resta siempre se genera >= 0
      return num1 / num2; // la división siempre se genera entera
    }

    function newOperation() {
      updateLevelBadge();

      // Repaso de fallos del modo activo
      if (failedQueue.length > 0 && failedQueue[0].m === mode && Math.random() < 0.35) {
        const item = failedQueue.shift();
        num1 = item.a;
        num2 = item.b;
      } else {
        const op = generarOperacion();
        num1 = op.a;
        num2 = op.b;
      }

      document.getElementById("opSign").textContent = mode;
      document.getElementById("n1").textContent = num1;
      document.getElementById("n2").textContent = num2;
      currentVal = "";
      updateDisplay();

      guardarEstadoModo(mode);
      iniciarTemporizador();
    }

    // Cambiar de operación: se recupera el estado individual de ese modo
    function elegirModo(m) {
      if (m === mode) return;

      // Guardar el estado del modo actual antes de cambiar
      guardarEstadoModo(mode);
      detenerTemporizador();
      clearTimeout(pendingTimer);
      pendingTimer = null;
      busy = false;

      mode = m;

      const botones = document.querySelectorAll(".mode-bar button");
      for (const btn of botones) {
        btn.classList.toggle("active", btn.dataset.mode === m);
      }

      cargarEstadoModo(mode);
      record = loadRecord(mode);

      renderScore();
      renderLives();
      renderStreak();
      updateLevelBadge();
      renderRecord();
      document.getElementById("feedback").textContent = "";
      currentVal = "";
      updateDisplay();

      const modal = document.getElementById("gameOverModal");
      if (modoEstados[mode].gameOver || lives <= 0) {
        document.getElementById("finalScore").textContent = score;
        modal.classList.add("show");
        renderTimerBar(0);
      } else {
        modal.classList.remove("show");
        if (num1 === null || num2 === null) {
          newOperation();
        } else {
          document.getElementById("opSign").textContent = mode;
          document.getElementById("n1").textContent = num1;
          document.getElementById("n2").textContent = num2;
          iniciarTemporizador();
        }
      }
    }

    function addNum(val) {
      if (lives <= 0 || busy) return;
      if (currentVal.length < 4) {
        currentVal += val;
        updateDisplay();
      }
    }

    function clearInput() {
      if (busy) return;
      currentVal = "";
      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById("display").textContent = currentVal;
    }

    // Manejo cuando el temporizador llega a cero
    function tiempoAgotado() {
      if (lives <= 0 || busy) return;
      busy = true;
      detenerTemporizador();

      const feedback = document.getElementById("feedback");
      const expected = resolverResultado();

      currentVal = "";
      updateDisplay();

      lives--;
      streak = 0;

      const penalty = Math.ceil(score / 2);
      score = Math.max(0, score - penalty);

      renderLives();
      renderStreak();
      renderScore();
      failedQueue.push({ m: mode, a: num1, b: num2 });
      guardarEstadoModo(mode);

      if (lives <= 0) {
        feedback.textContent = `¡Tiempo! Era ${expected} 😅`;
        feedback.className = "feedback incorrect";
        pendingTimer = setTimeout(() => {
          document.getElementById("finalScore").textContent = score;
          document.getElementById("gameOverModal").classList.add("show");
        }, 1000);
      } else {
        const loss = penalty > 0 ? ` (-1❤️ y -${penalty}⭐)` : " (-1❤️)";
        feedback.textContent = `¡Tiempo agotado! ⏱️${loss}`;
        feedback.className = "feedback incorrect";
        pendingTimer = setTimeout(() => {
          feedback.textContent = "";
          busy = false;
          // Se mantiene la misma operación y se reinicia el tiempo
          iniciarTemporizador();
        }, 1100);
      }
    }

    function checkAnswer() {
      if (currentVal === "" || lives <= 0 || busy) return;
      busy = true;
      detenerTemporizador();

      const feedback = document.getElementById("feedback");
      const result = parseInt(currentVal, 10);
      const expected = resolverResultado();

      // Limpia la respuesta al momento para evitar reenvíos con pulsaciones rápidas
      currentVal = "";
      updateDisplay();

      if (result === expected) {
        score++;
        streak++;
        totalAciertos++;
        renderScore();
        renderStreak();
        updateLevelBadge();

        const nuevoRecord = score > record;
        if (nuevoRecord) {
          record = score;
          saveRecord();
          renderRecord();
        }

        let msg, cls;
        if (streak % 10 === 0) {
          if (lives < MAX_LIVES) {
            lives++;
            renderLives();
            msg = `¡Racha de ${streak}! +1 Vida extra ❤️`;
            cls = "feedback bonus";
          } else {
            msg = `¡Racha de ${streak}! Imparable 🔥`;
            cls = "feedback correct";
          }
        } else {
          msg = nuevoRecord ? "¡Nuevo récord! 🏆" : "¡Muy bien! 🎉";
          cls = nuevoRecord ? "feedback record-new" : "feedback correct";
        }
        feedback.textContent = msg;
        feedback.className = cls;

        guardarEstadoModo(mode);

        pendingTimer = setTimeout(() => {
          feedback.textContent = "";
          busy = false;
          newOperation();
        }, 850);

      } else {
        lives--;
        streak = 0;

        // Penalización: la puntuación se divide por 2
        const penalty = Math.ceil(score / 2);
        score = Math.max(0, score - penalty);

        renderLives();
        renderStreak();
        renderScore();
        failedQueue.push({ m: mode, a: num1, b: num2 });
        guardarEstadoModo(mode);

        if (lives <= 0) {
          feedback.textContent = `Era ${expected} 😅`;
          feedback.className = "feedback incorrect";
          pendingTimer = setTimeout(() => {
            document.getElementById("finalScore").textContent = score;
            document.getElementById("gameOverModal").classList.add("show");
          }, 1000);
        } else {
          // No se revela la solución para que tenga que calcularla y resolverla
          const loss = penalty > 0 ? ` (-1❤️ y -${penalty}⭐)` : " (-1❤️)";
          feedback.textContent = `¡Casi! Vuelve a intentarlo${loss}`;
          feedback.className = "feedback incorrect";
          pendingTimer = setTimeout(() => {
            feedback.textContent = "";
            busy = false;
            // Se mantiene la misma operación y se reinicia el tiempo
            iniciarTemporizador();
          }, 1000);
        }
      }
    }

    function resetGame() {
      clearTimeout(pendingTimer);
      pendingTimer = null;
      busy = false;
      detenerTemporizador();

      modoEstados[mode] = crearEstadoInicial();
      guardarEstadosEnStorage();
      cargarEstadoModo(mode);

      renderScore();
      renderLives();
      renderStreak();
      updateLevelBadge();
      renderRecord();
      document.getElementById("feedback").textContent = "";
      document.getElementById("gameOverModal").classList.remove("show");
      newOperation();
    }

    // Pausar el temporizador si la pestaña pierde el foco o se apaga la pantalla
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        detenerTemporizador();
      } else if (lives > 0 && !busy && !modoEstados[mode].gameOver) {
        timerLastTick = Date.now();
        if (timerRemainingMs > 0 && timerId === null) {
          timerId = setInterval(() => {
            const now = Date.now();
            const delta = now - timerLastTick;
            timerLastTick = now;
            timerRemainingMs -= delta;

            if (timerRemainingMs <= 0) {
              detenerTemporizador();
              timerRemainingMs = 0;
              renderTimerBar(0);
              tiempoAgotado();
            } else {
              renderTimerBar(timerRemainingMs / timerTotalMs);
            }
          }, 50);
        }
      }
    });

    cargarEstadoModo(mode);
    record = loadRecord(mode);
    renderLives();
    renderStreak();
    renderScore();
    updateLevelBadge();
    renderRecord();

    const initialModal = document.getElementById("gameOverModal");
    if (modoEstados[mode].gameOver || lives <= 0) {
      document.getElementById("finalScore").textContent = score;
      initialModal.classList.add("show");
      renderTimerBar(0);
    } else {
      initialModal.classList.remove("show");
      if (num1 === null || num2 === null) {
        newOperation();
      } else {
        document.getElementById("opSign").textContent = mode;
        document.getElementById("n1").textContent = num1;
        document.getElementById("n2").textContent = num2;
        iniciarTemporizador();
      }
    }
  </script>
</body>
