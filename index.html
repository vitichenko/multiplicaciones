<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aprende a Multiplicar</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f4f8;
      touch-action: manipulation;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 360px;
      text-align: center;
      position: relative;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .lives {
      font-size: 1.4rem;
      letter-spacing: 2px;
    }
    .score-badge {
      background: #e2e8f0;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.95rem;
    }
    .question {
      font-size: 2.8rem;
      font-weight: 700;
      color: #1e293b;
      margin: 10px 0 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    .answer-box {
      font-size: 2.2rem;
      font-weight: 700;
      min-height: 56px;
      background: #f8fafc;
      border: 3px solid #cbd5e1;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      color: #0f172a;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    button {
      font-size: 1.6rem;
      font-weight: 600;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #e2e8f0;
      color: #334155;
      cursor: pointer;
      box-shadow: 0 4px #cbd5e1;
      user-select: none;
    }
    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px #cbd5e1;
    }
    button.clear {
      background: #fee2e2;
      color: #dc2626;
      box-shadow: 0 4px #fca5a5;
    }
    button.clear:active { box-shadow: 0 1px #fca5a5; }
    button.check {
      background: #dcfce7;
      color: #16a34a;
      box-shadow: 0 4px #86efac;
    }
    button.check:active { box-shadow: 0 1px #86efac; }
    .feedback {
      height: 28px;
      margin-top: 14px;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .correct { color: #16a34a; }
    .incorrect { color: #dc2626; }
    .bonus { color: #ea580c; }

    /* Pantalla de Fin de Partida */
    .game-over-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: white;
      border-radius: 24px;
      padding: 24px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    .game-over-modal.show {
      display: flex;
    }
    .game-over-modal h2 {
      margin: 0;
      font-size: 2rem;
      color: #dc2626;
    }
    .game-over-modal p {
      margin: 0;
      font-size: 1.2rem;
      color: #475569;
    }
    .btn-restart {
      background: #3b82f6;
      color: white;
      box-shadow: 0 4px #2563eb;
      padding: 14px 28px;
      font-size: 1.2rem;
      margin-top: 8px;
    }
    .btn-restart:active {
      box-shadow: 0 1px #2563eb;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Barra de estado: Vidas y Puntuación -->
  <div class="status-bar">
    <div class="lives" id="lives">❤️❤️❤️</div>
    <div class="score-badge">⭐ <span id="score">0</span> aciertos</div>
  </div>

  <div class="question">
    <span id="n1">0</span>
    <span>×</span>
    <span id="n2">0</span>
  </div>

  <div class="answer-box" id="display"></div>

  <div class="grid">
    <button onclick="addNum('1')">1</button>
    <button onclick="addNum('2')">2</button>
    <button onclick="addNum('3')">3</button>
    <button onclick="addNum('4')">4</button>
    <button onclick="addNum('5')">5</button>
    <button onclick="addNum('6')">6</button>
    <button onclick="addNum('7')">7</button>
    <button onclick="addNum('8')">8</button>
    <button onclick="addNum('9')">9</button>
    <button class="clear" onclick="clearInput()">✕</button>
    <button onclick="addNum('0')">0</button>
    <button class="check" onclick="checkAnswer()">✓</button>
  </div>

  <div class="feedback" id="feedback"></div>

  <!-- Pantalla de Game Over -->
  <div class="game-over-modal" id="gameOverModal">
    <h2>¡Fin de la partida! 💔</h2>
    <p>Has conseguido <b id="finalScore">0</b> aciertos.</p>
    <button class="btn-restart" onclick="resetGame()">Jugar otra vez 🔁</button>
  </div>
</div>

<script>
  let num1 = 0;
  let num2 = 0;
  let currentVal = "";
  let lives = 3;
  let score = 0;
  const MAX_LIVES = 5;

  function renderLives() {
    let hearts = "";
    for (let i = 0; i < lives; i++) hearts += "❤️";
    document.getElementById("lives").textContent = hearts;
  }

  function newOperation() {
    num1 = Math.floor(Math.random() * 11);
    num2 = Math.floor(Math.random() * 11);
    document.getElementById("n1").textContent = num1;
    document.getElementById("n2").textContent = num2;
    currentVal = "";
    updateDisplay();
  }

  function addNum(val) {
    if (lives <= 0) return;
    if (currentVal.length < 4) {
      currentVal += val;
      updateDisplay();
    }
  }

  function clearInput() {
    currentVal = "";
    updateDisplay();
  }

  function updateDisplay() {
    document.getElementById("display").textContent = currentVal;
  }

  function checkAnswer() {
    if (currentVal === "" || lives <= 0) return;

    const feedback = document.getElementById("feedback");
    const result = parseInt(currentVal, 10);
    const expected = num1 * num2;

    if (result === expected) {
      score++;
      document.getElementById("score").textContent = score;

      // Cada 10 aciertos suma una vida extra
      if (score % 10 === 0) {
        if (lives < MAX_LIVES) {
          lives++;
          renderLives();
          feedback.textContent = "¡Racha de 10! +1 Vida extra ❤️";
          feedback.className = "feedback bonus";
        } else {
          feedback.textContent = "¡Increíble racha de 10! 🎉";
          feedback.className = "feedback correct";
        }
      } else {
        feedback.textContent = "¡Muy bien! 🎉";
        feedback.className = "feedback correct";
      }

      setTimeout(() => {
        feedback.textContent = "";
        newOperation();
      }, 900);

    } else {
      lives--;
      renderLives();

      if (lives <= 0) {
        feedback.textContent = `Era ${expected} 😅`;
        feedback.className = "feedback incorrect";
        setTimeout(() => {
          document.getElementById("finalScore").textContent = score;
          document.getElementById("gameOverModal").classList.add("show");
        }, 1000);
      } else {
        feedback.textContent = `¡Casi! Pierdes 1 vida (-1 ❤️)`;
        feedback.className = "feedback incorrect";
        setTimeout(() => {
          currentVal = "";
          updateDisplay();
          feedback.textContent = "";
        }, 1100);
      }
    }
  }

  function resetGame() {
    lives = 3;
    score = 0;
    document.getElementById("score").textContent = score;
    renderLives();
    document.getElementById("feedback").textContent = "";
    document.getElementById("gameOverModal").classList.remove("show");
    newOperation();
  }

  // Inicialización
  renderLives();
  newOperation();
</script>
</body>
</html>
