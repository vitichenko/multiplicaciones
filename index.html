const fs = require("fs");
const src = fs.readFileSync("/home/victor/Proyectos/multi/index.html", "utf8");
const m = src.match(/<script>([\s\S]*?)<\/script>/);
if (!m) throw new Error("no script");

function makeEl() {
  const s = new Set();
  return {
    textContent: "",
    className: "",
    classList: {
      add(c) { s.add(c); },
      remove(c) { s.delete(c); },
      contains(c) { return s.has(c); }
    }
  };
}
const ids = ["n1", "n2", "lives", "score", "streak", "level", "display", "feedback", "finalScore", "gameOverModal"];
const els = {};
for (const id of ids) els[id] = makeEl();
global.document = { getElementById: (id) => els[id] };

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const sleepMs = 900;
let ok = 0, fail = 0;
const assert = (cond, msg) => {
  if (cond) { ok++; console.log("  OK  " + msg); }
  else { fail++; console.error("  FAIL " + msg); }
};

const tests = `
function setQ(a, b) { num1 = a; num2 = b; }
function answer(v) { currentVal = String(v); updateDisplay(); }

(async () => {
  resetGame();

  // --- A: acierto suma punto y racha; doble pulso bloqueado
  setQ(2, 3); answer(6);
  checkAnswer();
  assert(score === 1 && streak === 1 && totalAciertos === 1, "A: acierto suma +1 punto, +1 racha y +1 acierto acumulado");
  const sA = score, stA = streak;
  checkAnswer();
  assert(score === sA && streak === stA, "A: doble pulso tras acierto NO vuelve a puntuar (bloqueo busy)");
  await sleep(${sleepMs});

  // --- B: racha 10 -> +1 vida
  lives = 3; score = 0; streak = 9; totalAciertos = 9;
  setQ(2, 3); answer(6);
  checkAnswer();
  assert(lives === 4, "B: racha de 10 aciertos seguidos suma 1 vida (3 -> 4)");
  assert(streak === 10 && totalAciertos === 10, "B: racha llega a 10 y aciertos acumulados a 10");
  assert(els.feedback.textContent.includes("+1 Vida extra"), "B: muestra mensaje de vida extra");
  await sleep(${sleepMs});

  // --- C: tope de 5 vidas
  lives = 5; streak = 9; totalAciertos = 10;
  setQ(3, 4); answer(12);
  checkAnswer();
  assert(lives === 5, "C: con tope de 5 vidas no suma más (sigue en 5)");
  assert(els.feedback.textContent.includes("Imparable"), "C: con tope muestra 'Imparable'");
  await sleep(${sleepMs});

  // --- D: fallo quita vida y divide puntos por 2; doble pulso no resta 2 vidas
  score = 10; lives = 3; streak = 0; totalAciertos = 10;
  setQ(2, 3); answer(7);
  checkAnswer();
  assert(lives === 2, "D: fallo quita 1 vida (3 -> 2)");
  assert(score === 5, "D: fallo divide puntos por 2 (10 -> 5)");
  assert(streak === 0, "D: fallo resetea la racha");
  assert(els.feedback.textContent.includes("Era 6") && els.feedback.textContent.includes("-5"), "D: muestra respuesta correcta y penalización");
  const livesD = lives;
  checkAnswer();
  assert(lives === livesD, "D: doble pulso tras fallo NO quita otra vida (bloqueo busy)");
  await sleep(1400);

  // --- E: fallo con 0 puntos no muestra "-0⭐"
  score = 0; lives = 3; totalAciertos = 12;
  setQ(4, 5); answer(3);
  checkAnswer();
  assert(score === 0, "E: fallo con 0 puntos deja 0 (no negativos)");
  assert(els.feedback.textContent === "Era 20 (-1❤️)", "E: mensaje sin '-0⭐' feo");
  await sleep(1400);

  // --- F: reset cancela el temporizador de fin de partida
  lives = 1; score = 8; totalAciertos = 12;
  setQ(5, 5); answer(0);
  checkAnswer();
  assert(lives === 0, "F: último fallo deja 0 vidas");
  resetGame();
  await sleep(1200);
  assert(!els.gameOverModal.classList.contains("show"), "F: reiniciar cancela el fin de partida pendiente");
  assert(lives === 3 && busy === false && totalAciertos === 0, "F: reset restaura vidas, desbloquea y pone aciertos a 0");

  // --- G: fin de partida real al llegar a 0 vidas
  lives = 1; score = 0; streak = 0; totalAciertos = 0;
  setQ(6, 6); answer(5);
  checkAnswer();
  assert(els.feedback.textContent.includes("Era 36"), "G: último fallo muestra la respuesta correcta");
  await sleep(1100);
  assert(els.gameOverModal.classList.contains("show"), "G: aparece el modal de fin de partida");
  assert(els.finalScore.textContent == score, "G: modal muestra la puntuación final");

  // --- H: dificultad por aciertos acumulados aunque el score sea 0
  score = 0; totalAciertos = 25;
  updateLevelBadge();
  assert(els.level.textContent.includes("Pro"), "H: nivel 'Pro' según aciertos acumulados aunque score sea 0");

  console.log("\\nRESULTADO: " + ok + " OK, " + fail + " FAIL");
  process.exit(fail > 0 ? 1 : 0);
})();
`;

eval(m[1] + "\n" + tests);
